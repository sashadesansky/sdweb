<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasha Desansky</title>
<meta name="description" content="Aleksandra “Sasha” Desansky — Principal at Boston Consulting Group. Technology strategy, AI transformation, and a running portfolio of projects.">

<!-- Open Graph / link-preview tags, used when this site is shared as a link -->
<meta property="og:title" content="Sasha Desansky">
<meta property="og:description" content="Technology strategy, AI transformation, and a running portfolio of AI projects.">
<meta property="og:type" content="website">

<link rel="icon" href="images/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== Masthead ===================== -->
<header class="masthead-band" id="masthead">
  <div class="masthead-inner">
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="#top" class="wordmark">SASHA DESANSKY</a>
    <nav>
      <ul class="nav-links">
        <li><a class="nav-link" href="#about">About</a></li>
        <li><a class="nav-link" href="#experience">Experience</a></li>
        <li><a class="nav-link" href="#projects">Projects</a></li>
        <li><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </nav>
    <a class="button-primary nav-cta" href="#contact">Get in touch</a>
  </div>
</header>

<main id="top">

  <!-- ===================== Hero ===================== -->
  <section class="hero-band">
    <div class="hero-inner">
      <div>
        <p class="hero-eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero-headline" id="hero-headline"></h1>
        <p class="hero-subhead" id="hero-subhead"></p>
        <div class="hero-actions">
          <a class="button-primary" href="#contact">Get in touch</a>
          <a class="button-outline" id="hero-linkedin" href="#" target="_blank" rel="noopener">Connect on LinkedIn</a>
        </div>
      </div>
      <div class="hero-avatar-col">
        <div class="avatar" id="hero-avatar"></div>
      </div>
    </div>
  </section>

  <!-- ===================== About ===================== -->
  <section class="page-section" id="about">
    <div class="section-inner">
      <h2 class="section-heading" id="about-heading">About</h2>
      <div class="about-body" id="about-body"></div>
    </div>
  </section>

  <!-- ===================== Experience ===================== -->
  <section class="page-section" id="experience">
    <div class="section-inner">
      <h2 class="section-heading" id="experience-heading">Experience</h2>
      <p class="experience-note" id="experience-note"></p>
      <a class="button-primary" id="experience-linkedin" href="#" target="_blank" rel="noopener">View LinkedIn Profile</a>
    </div>
  </section>


  <!-- ===================== Projects ===================== -->
  <section class="page-section" id="projects">
    <div class="section-inner">
      <h2 class="section-heading">AI Project Portfolio / Playground</h2>
      <div class="story-grid" id="projects-list"></div>
    </div>
  </section>

  <!-- ===================== For Fun ===================== -->
  <section class="page-section" id="for-fun">
    <div class="section-inner">
      <h2 class="section-heading">For Fun</h2>
      <div class="story-grid" id="fun-projects-list"></div>
    </div>
  </section>

  <!-- ===================== Contact ===================== -->
  <section class="page-section" id="contact">
    <div class="section-inner">
      <h2 class="section-heading">Get in touch</h2>
      <p class="contact-detail" id="contact-detail"></p>
      <div class="contact-row">
        <a class="button-primary" id="contact-email" href="#">Email me</a>
        <a class="button-outline" id="contact-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </section>

</main>

<!-- ===================== Footer ===================== -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-wordmark" id="footer-wordmark"></div>
    <ul class="footer-links">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a id="footer-email" href="#">Email</a></li>
    </ul>
  </div>
  <div class="footer-inner">
    <p class="footer-note" id="footer-note"></p>
  </div>
</footer>

<script src="content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
